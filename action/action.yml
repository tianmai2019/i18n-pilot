name: 'i18n-pilot'
description: 'Detect hardcoded strings and enforce i18n quality gate on every PR'
author: 'PanZhang'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  path:
    description: 'Path to scan (relative to workspace)'
    required: false
    default: '.'
  format:
    description: 'Output format: sarif | json | compact | stylish'
    required: false
    default: 'sarif'
  version:
    description: 'i18n-pilot npm version (default: latest)'
    required: false
    default: 'latest'
  incremental:
    description: 'Incremental scan mode. "auto" scans only PR-changed files; "full" always scans the entire path.'
    required: false
    default: 'auto'
  fail-on:
    description: 'Severity level that fails the job. Options: error | warning | never. Default: error.'
    required: false
    default: 'error'
  threshold:
    description: 'Max number of qualifying issues allowed before failing. 0 means any qualifying issue fails the job.'
    required: false
    default: '0'
  output-file:
    description: 'Path to write the report. Defaults to i18n-pilot-report.<format> in the workspace root.'
    required: false
  comment-on-pr:
    description: 'Post (or update) a Markdown comment on the PR summarizing the scan. Only applies to pull_request events. Requires pull-requests: write permission.'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token used to post PR comments. Defaults to the workflow-provided GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}

outputs:
  report-path:
    description: 'Path to the generated report file'
    value: ${{ steps.scan.outputs.report-path }}
  issue-count:
    description: 'Total number of issues found (only accurate for format=json; otherwise "unknown")'
    value: ${{ steps.scan.outputs.issue-count }}
  scanned-paths:
    description: 'Space-separated list of files/paths that were scanned'
    value: ${{ steps.targets.outputs.paths }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install i18n-pilot
      shell: bash
      run: npm install -g i18n-pilot@${{ inputs.version }}

    - name: Resolve scan targets (incremental or full)
      id: targets
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_INCREMENTAL: ${{ inputs.incremental }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: bash "$GITHUB_ACTION_PATH/scripts/incremental.sh"

    - name: Run i18n-pilot scan
      id: scan
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        TARGETS: ${{ steps.targets.outputs.paths }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-scan.sh"

    - name: Ensure JSON report (for PR comment and/or gate)
      id: json
      if: (github.event_name == 'pull_request' && inputs.comment-on-pr == 'true') || inputs.fail-on != 'never'
      shell: bash
      env:
        INPUT_FORMAT: ${{ inputs.format }}
        REPORT_PATH: ${{ steps.scan.outputs.report-path }}
        TARGETS: ${{ steps.targets.outputs.paths }}
      run: bash "$GITHUB_ACTION_PATH/scripts/ensure-json.sh"

    - name: Post PR comment
      if: github.event_name == 'pull_request' && inputs.comment-on-pr == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const buildAndPost = require(`${process.env.GITHUB_ACTION_PATH}/scripts/pr-comment.cjs`);
          await buildAndPost({
            github,
            context,
            core,
            jsonPath: '${{ steps.json.outputs.json-path }}',
            scannedPaths: `${{ steps.targets.outputs.paths }}`,
          });

    - name: Write GitHub step summary
      shell: bash
      run: |
        {
          echo "## 🌐 i18n-pilot Scan"
          echo ""
          echo "| Field | Value |"
          echo "| --- | --- |"
          echo "| Report | \`${{ steps.scan.outputs.report-path }}\` |"
          echo "| Issue count | ${{ steps.scan.outputs.issue-count }} |"
          echo "| Format | ${{ inputs.format }} |"
          echo "| Scanned | \`${{ steps.targets.outputs.paths }}\` |"
          echo "| fail-on | ${{ inputs.fail-on }} |"
          echo "| threshold | ${{ inputs.threshold }} |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce threshold gate
      if: inputs.fail-on != 'never'
      uses: actions/github-script@v7
      with:
        script: |
          const runGate = require(`${process.env.GITHUB_ACTION_PATH}/scripts/gate.cjs`);
          await runGate({
            core,
            jsonPath: '${{ steps.json.outputs.json-path }}',
            failOn: '${{ inputs.fail-on }}',
            threshold: '${{ inputs.threshold }}',
          });
